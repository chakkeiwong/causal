[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "causalbank-research"
version = "0.4.0"
description = "Research components accompanying the banking causal-inference product proposal"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
research = ["scikit-learn>=1.3", "duckdb>=1.0", "polars>=1.0", "pyarrow>=14", "jsonschema>=4.18", "threadpoolctl>=3"]
nonlinear = ["jax>=0.4", "threadpoolctl>=3"]

[tool.setuptools.packages.find]
where = ["src"]
