<!DOCTYPE html>
<html lang="en">
<head>
    

    <title>causaLens Login - Authentication</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/bootstrap-grid.min.css">
    <link rel="stylesheet" href="/static/css/bootstrap-reboot.min.css">
    <link rel="stylesheet" href="/static/css/bootstrap-utilities.min.css">
    <link rel="stylesheet" href="/static/css/index.css">
    <script>
        function logout(){
            window.location.href = '/logout';
        }
    </script>
    
<script>
    const nonce = '';
    const codeChallenge = '';
    const codeChallengeMethod = '';

    function submitform(e){
        e.preventDefault();
        const email = document.getElementById('email').value;
        const remember_email = document.getElementById('remember_email').checked;

        const body = {
            'email': email,
            'state': 'eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0eXAiOiJwcmVfYXV0aCIsImNsaWVudF9pZCI6IjNkZDMyOGZjLWU3MWItNDk1ZC04NzRkLWFhYjQ2ZDYxOTA0YiIsInJlZGlyZWN0X3VyaSI6Imh0dHBzOi8vZG9jcy5jYXVzYWxlbnMuY29tL29hdXRoMi9jYWxsYmFjayIsInJwX3N0YXRlIjoiS29YSng3aGRxZi1Yc1R6dFJaZ0tINFNkZlM2QW1iQ1hwMGFKV0xxQ2JvODovIiwiaWF0IjoxNzkxODYxNzM4LCJleHAiOjE3OTE4NjIzMzh9.8gs2oMnmrta6B0JBLzWKzdt0VS_Is7MNM9jyvbHXRS3SMGPHcQr8rnLboeXTPr6c2d79Jxi5NuIvImD6NKh8Yg',
            'remember_email': remember_email
        };
        if (nonce) {
            body['nonce'] = nonce;
        }
        if (codeChallenge) {
            body['code_challenge'] = codeChallenge;
            body['code_challenge_method'] = codeChallengeMethod || 'S256';
        }

        fetch('/api/authentication/authenticate', {
            'method': 'POST',
            'headers': {
                'Content-Type': 'application/json'
            },
            'body': JSON.stringify(body)
        })
        .then(response => response.json())
        .then(data => {
            action = data['action'];
            if(action == 'REDIRECT'){
                window.location.href = data['path'];
            } else if (action == 'PASSWORD'){
                document.getElementById('password-div').classList.remove('d-none');
                document.getElementById('password-div').setAttribute('required', '');
                let auth_form = document.getElementById('auth-form');
                auth_form.removeAttribute('onsubmit');
                auth_form.setAttribute('action', '/api/authentication/verify-identity?state=eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0eXAiOiJwcmVfYXV0aCIsImNsaWVudF9pZCI6IjNkZDMyOGZjLWU3MWItNDk1ZC04NzRkLWFhYjQ2ZDYxOTA0YiIsInJlZGlyZWN0X3VyaSI6Imh0dHBzOi8vZG9jcy5jYXVzYWxlbnMuY29tL29hdXRoMi9jYWxsYmFjayIsInJwX3N0YXRlIjoiS29YSng3aGRxZi1Yc1R6dFJaZ0tINFNkZlM2QW1iQ1hwMGFKV0xxQ2JvODovIiwiaWF0IjoxNzkxODYxNzM4LCJleHAiOjE3OTE4NjIzMzh9.8gs2oMnmrta6B0JBLzWKzdt0VS_Is7MNM9jyvbHXRS3SMGPHcQr8rnLboeXTPr6c2d79Jxi5NuIvImD6NKh8Yg');
            } else if (action == 'REGISTER'){
                window.location.href = `/request-access?email=${encodeURIComponent(email)}&state=eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0eXAiOiJwcmVfYXV0aCIsImNsaWVudF9pZCI6IjNkZDMyOGZjLWU3MWItNDk1ZC04NzRkLWFhYjQ2ZDYxOTA0YiIsInJlZGlyZWN0X3VyaSI6Imh0dHBzOi8vZG9jcy5jYXVzYWxlbnMuY29tL29hdXRoMi9jYWxsYmFjayIsInJwX3N0YXRlIjoiS29YSng3aGRxZi1Yc1R6dFJaZ0tINFNkZlM2QW1iQ1hwMGFKV0xxQ2JvODovIiwiaWF0IjoxNzkxODYxNzM4LCJleHAiOjE3OTE4NjIzMzh9.8gs2oMnmrta6B0JBLzWKzdt0VS_Is7MNM9jyvbHXRS3SMGPHcQr8rnLboeXTPr6c2d79Jxi5NuIvImD6NKh8Yg`;
            }
        })
    }
</script>

</head>
<body>
    
    

    <div id="content">
<div class="wrapper w-100 d-flex align-items-center justify-content-center">
   <img
      alt="login background"
      class="background-image w-100 h-100"
      src="/static/img/login_page_background.svg"
      />
   <div class="login-container w-100 mw-100 d-flex align-items-center">
      <div class="logo-wrapper d-flex flex-column">
         <img alt="logo" class="logo" src="/static/img/logo.svg" />
      </div>
      <div class="login-card mw-100 d-flex flex-column align-items-center" >
         <div class="login-header">Log In</div>
         <form class="login-form d-flex flex-column align-items-center justify-content-between" id="auth-form" method="post" onsubmit="submitform(event)">
            <input type="hidden" name="nonce" id="nonce_input" value=""/>
            <input type="hidden" name="code_challenge" id="code_challenge_input" value=""/>
            <input type="hidden" name="code_challenge_method" id="code_challenge_method_input" value=""/>
            <div class="form-group w-100">
               <label for="email">Email</label>
               <input class="form-control my-2" type="email" name="email" id="email" autocomplete="email" required value=""/>
               <div id="password-div" class="form-group d-none">
                    <label for="password">Password</label>
                    <input class="form-control my-2" type="password" name="password" id="password" autocomplete="current-password"/>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" value="" name="remember_email" id="remember_email" />
                  <label class="form-check-label" for="remember_email">
                  Remember me
                  </label>
               </div>
            </div>
            <div class="row justify-content-center">
               <input class="login-button" type="submit" value="Log In">
            </div>
            <div class="privacy-policy d-flex justify-content-center mt-2 ms-2 me-2">
               <p class="text-center">By logging in, you consent to and accept our <a href="https://www.causalens.com/privacy-policy/" rel="noreferrer" target="_blank">Privacy Policy</a></p>
            </div>
         </form>
      </div>
   </div>
</div>
</div>
</div>
    <div id="footer">
        
        
        <script src="/static/js/bootstrap.min.js"></script>
        <script src="/static/js/htmx.min.js"></script>
        <script src="/static/js/json-enc.js"></script>
    </div>
</body>
</html>
